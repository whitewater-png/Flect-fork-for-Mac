name: CI

on:
  push:
    branches: [main, "claude/**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  core:
    name: Rust core (fmt, clippy, test)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: core
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: ffmpeg and a JDK for the end-to-end tests
        working-directory: .
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg
          bash scripts/fetch-cfr.sh "$RUNNER_TEMP/deps"
          echo "FLECT_TEST_CFR_JAR=$RUNNER_TEMP/deps/cfr.jar" >> "$GITHUB_ENV"
      - run: cargo fmt --all -- --check
      - run: cargo clippy --all-targets --locked -- -D warnings
      - run: cargo test --all --locked

  deny:
    name: Dependency audit (cargo-deny)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: EmbarkStudios/cargo-deny-action@v2
        with:
          manifest-path: core/Cargo.toml
          arguments: --all-features
