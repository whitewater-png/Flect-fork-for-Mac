name: CI

on:
  push:
    branches: [main, "claude/**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  core:
    name: Rust core (fmt, clippy, test)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: core
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: ffmpeg and a JDK for the end-to-end tests
        working-directory: .
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg
          bash scripts/fetch-cfr.sh "$RUNNER_TEMP/deps"
          echo "FLECT_TEST_CFR_JAR=$RUNNER_TEMP/deps/cfr.jar" >> "$GITHUB_ENV"
      - run: cargo fmt --all -- --check
      - run: cargo clippy --all-targets --locked -- -D warnings
      - run: cargo test --all --locked

  deny:
    name: Dependency audit (cargo-deny)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: EmbarkStudios/cargo-deny-action@v2
        with:
          manifest-path: core/Cargo.toml
          arguments: --all-features

  swift:
    name: Swift app (macOS)
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Build the Rust engine and tools
        working-directory: core
        run: cargo build --release --locked
      - name: Swift version
        run: swift --version
      - name: Build the app
        working-directory: app
        run: |
          set -o pipefail
          swift build 2>&1 | tail -150
      - name: Test the app core
        working-directory: app
        run: |
          set -o pipefail
          swift test 2>&1 | tail -150
      - name: Generate the Quick Actions and validate them
        run: |
          core/target/release/flect-tools --out "$RUNNER_TEMP/qa"
          ls "$RUNNER_TEMP/qa" | wc -l
          for f in "$RUNNER_TEMP"/qa/*.workflow/Contents/*; do plutil -lint "$f"; done
