<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <defs>
    <linearGradient id="base" x1="0.1" y1="0" x2="0.9" y2="1">
      <stop offset="0" stop-color="#7DF2B8"/>
      <stop offset="0.45" stop-color="#17B574"/>
      <stop offset="1" stop-color="#05503A"/>
    </linearGradient>
    <radialGradient id="glowA" cx="0.25" cy="0.15" r="0.7">
      <stop offset="0" stop-color="#E9FFF4" stop-opacity="0.85"/>
      <stop offset="1" stop-color="#E9FFF4" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowB" cx="0.85" cy="0.95" r="0.6">
      <stop offset="0" stop-color="#00382A" stop-opacity="0.65"/>
      <stop offset="1" stop-color="#00382A" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="glass" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.82"/>
      <stop offset="0.5" stop-color="#E8FFF4" stop-opacity="0.34"/>
      <stop offset="0.85" stop-color="#BFFFE0" stop-opacity="0.22"/>
      <stop offset="1" stop-color="#FFFFFF" stop-opacity="0.45"/>
    </linearGradient>
    <linearGradient id="rim" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.95"/>
      <stop offset="0.5" stop-color="#FFFFFF" stop-opacity="0.12"/>
      <stop offset="1" stop-color="#FFFFFF" stop-opacity="0.55"/>
    </linearGradient>
    <linearGradient id="gloss" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.60"/>
      <stop offset="1" stop-color="#FFFFFF" stop-opacity="0"/>
    </linearGradient>
    <filter id="drop" x="-20%" y="-20%" width="140%" height="150%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="22"/>
      <feOffset dy="26"/>
      <feComponentTransfer><feFuncA type="linear" slope="0.38"/></feComponentTransfer>
      <feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="soft" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="42"/>
    </filter>
    <filter id="soft2" x="-10%" y="-10%" width="120%" height="140%"><feGaussianBlur stdDeviation="16"/></filter>
    <clipPath id="tile"><rect x="100" y="100" width="824" height="824" rx="184"/></clipPath>
  </defs>

  <!-- tile -->
  <g filter="url(#drop)">
    <rect x="100" y="100" width="824" height="824" rx="184" fill="url(#base)"/>
  </g>
  <g clip-path="url(#tile)">
    <rect x="100" y="100" width="824" height="824" fill="url(#glowA)"/>
    <rect x="100" y="100" width="824" height="824" fill="url(#glowB)"/>
    <!-- soft refracted blobs -->
    <circle cx="760" cy="250" r="150" fill="#C9FFE6" opacity="0.28" filter="url(#soft)"/>
    <circle cx="260" cy="800" r="190" fill="#0A6B4B" opacity="0.45" filter="url(#soft)"/>
    <!-- top specular band -->
    <path d="M100 100h824v250C760 410 560 420 100 360z" fill="url(#gloss)" opacity="0.5" filter="url(#soft2)"/>
  </g>
  <rect x="103" y="103" width="818" height="818" rx="181" fill="none" stroke="url(#rim)" stroke-width="6"/>

  <!-- the "F": three glass bars (stem, top arm, middle arm) -->
  <g filter="url(#drop)">
    <rect x="318" y="262" width="150" height="500" rx="75" fill="url(#glass)"/>
    <rect x="318" y="262" width="400" height="150" rx="75" fill="url(#glass)"/>
    <rect x="318" y="468" width="300" height="140" rx="70" fill="url(#glass)"/>
  </g>
  <g fill="none" stroke="url(#rim)" stroke-width="5">
    <rect x="320" y="264" width="146" height="496" rx="73"/>
    <rect x="320" y="264" width="396" height="146" rx="73"/>
    <rect x="320" y="470" width="296" height="136" rx="68"/>
  </g>
  <!-- highlights on the bars -->
  <g fill="#FFFFFF" opacity="0.55">
    <ellipse cx="520" cy="292" rx="130" ry="14"/>
    <ellipse cx="450" cy="500" rx="95" ry="12"/>
    <ellipse cx="393" cy="320" rx="14" ry="42"/>
  </g>
</svg>
