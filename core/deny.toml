[advisories]
yanked = "deny"

# Licenses actually present in the dependency tree (checked with `cargo metadata`, 2026-10-20).
# Dual-licensed crates need only one acceptable alternative.
[licenses]
allow = [
  "Apache-2.0", "MIT", "Zlib", "BSD-3-Clause", "BSL-1.0", "Unlicense", "0BSD",
  "Unicode-3.0", "Apache-2.0 WITH LLVM-exception",
]
confidence-threshold = 0.9

[bans]
multiple-versions = "warn"
wildcards = "deny"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
