[workspace]
resolver = "2"
members = ["flect-core", "flect-engine"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
publish = false

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order", "arbitrary_precision"] }

[workspace.lints.rust]
unsafe_code = "forbid"
