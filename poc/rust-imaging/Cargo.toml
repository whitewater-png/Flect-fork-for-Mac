[package]
name = "poc-rust-imaging"
version = "0.0.0"
edition = "2021"
publish = false

[dependencies]
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "gif", "ico", "webp", "bmp"] }
webp = "0.3"
resvg = "0.45"
fast_image_resize = { version = "5", features = ["image"] }
imageproc = { version = "0.25", default-features = false }
